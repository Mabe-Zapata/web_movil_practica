<div class="login-container">
  <h2>Iniciar Sesión</h2>
  <input 
    type="text" 
    [(ngModel)]="username" 
    placeholder="Usuario"
    class="input-field"
  />
  <input 
    type="password" 
    [(ngModel)]="password" 
    placeholder="Contraseña"
    class="input-field"
  />
  <button (click)="onLogin()" class="btn-primary">Entrar</button>
  <p *ngIf="error" class="error">{{ error }}</p>
</div>
